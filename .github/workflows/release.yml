# Builds the extension zip and publishes it as a GitHub release when a version tag (v1.2.3) is pushed.
# The zip has manifest.json at its root: it's what gets uploaded to the Chrome Web Store, and what
# jaskaransethy.com links to (releases/latest/download/insight-extractor-extension.zip).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the manifest version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest version $version" >&2
            exit 1
          fi

      - name: Zip the extension
        run: zip -r insight-extractor-extension.zip manifest.json background.js content.js icons LICENSE

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" insight-extractor-extension.zip --title "$GITHUB_REF_NAME" --generate-notes
